name: Deploy raibert.lol

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: raibert-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: raibert-prod

jobs:
  deploy:
    # workflow_run's branch filter also matches pull requests from forks whose branch is named main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.7

      # Deploy the exact runtime CI built and tested for this commit.
      - name: Replace committed runtime with the tested build
        if: github.event_name == 'workflow_run'
        run: rm -rf public/web/ruby-*.wasm public/web/ruby-*.js public/web/licenses

      - name: Download tested web runtime
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: web-runtime
          path: public/web
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # A manual deploy has no CI run to take the runtime from, so it rebuilds with CI's caches.
      - name: Compute web runtime cache keys
        id: keys
        if: github.event_name == 'workflow_dispatch'
        run: script/build_web --cache-keys >> "$GITHUB_OUTPUT"

      - name: Restore packed web runtime
        id: app-cache
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache/restore@v6
        with:
          path: build/web-runtime/out
          key: web-runtime-app-${{ steps.keys.outputs.app }}

      - name: Restore Ruby WebAssembly interpreter
        if: github.event_name == 'workflow_dispatch' && steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: build/web-runtime/base
          key: web-runtime-base-${{ steps.keys.outputs.base }}

      - name: Rebuild Ruby WebAssembly application
        if: github.event_name == 'workflow_dispatch'
        run: script/build_web

      - name: Package static site
        run: script/package_site "$RUNNER_TEMP/raibert-site"

      - name: Verify OIDC identity
        env:
          EXPECTED_ISSUER: https://token.actions.githubusercontent.com
          EXPECTED_SUBJECT: repo:cdimartino@191587/raibert@1373118135:ref:refs/heads/main
        run: |
          response="$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          token="$(jq --raw-output .value <<<"$response")"
          python3 -c '
          import base64, json, sys
          token = sys.stdin.read().strip()
          expected = sys.argv[1]
          expected_issuer = sys.argv[2]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          public_claims = {
              key: claims.get(key)
              for key in ("iss", "aud", "sub", "repository", "ref")
          }
          print(json.dumps(public_claims, sort_keys=True))
          if (
              claims.get("iss") != expected_issuer
              or claims.get("aud") != "sts.amazonaws.com"
              or claims.get("sub") != expected
          ):
              raise SystemExit("Unexpected GitHub OIDC identity")
          ' "$EXPECTED_SUBJECT" "$EXPECTED_ISSUER" <<<"$token"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: raibert-${{ github.run_id }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

      - name: Deploy static site
        run: script/deploy_site "$RUNNER_TEMP/raibert-site"
