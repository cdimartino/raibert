name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      magneto:
        description: Run a disposable x86 canary on this non-main ref
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruby:
    name: Ruby unit & integration
    runs-on: ${{ fromJSON(((github.event_name != 'workflow_dispatch' && vars.RAIBERT_CI_POOL == 'magneto') || (github.event_name == 'workflow_dispatch' && inputs.magneto && github.ref != 'refs/heads/main')) && '["self-hosted","Linux","X64","homelab-linux-x64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Gosu system dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libfontconfig1-dev libgl1-mesa-dev libmpg123-dev libopenal-dev \
            libsdl2-dev libsdl2-ttf-dev libsndfile1-dev

      - name: Install gems on the disposable runner
        if: runner.environment == 'self-hosted'
        run: |
          ruby -e 'abort "unexpected Ruby version" unless RUBY_VERSION == "4.0.7"'
          bundle config set --local path vendor/bundle
          bundle install

      - name: Set up Ruby
        if: runner.environment == 'github-hosted'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.7
          bundler-cache: true

      - name: Enforce 100% GameState unit coverage
        run: bundle exec ruby test/unit_coverage_test.rb

      - name: Test leaderboard ranking and validation domain
        run: ruby test/leaderboard_test.rb

      - name: Test analytics collector and WAF request boundaries
        run: |
          ruby test/analytics_test.rb
          ruby test/waf_test.rb

      - name: Run browser shim and HTTP integration tests
        run: |
          ruby test/web_shim_test.rb
          bundle exec ruby test/rack_test.rb
          bundle exec ruby test/site_test.rb
          ruby test/deploy_site_test.rb

      - name: Run deterministic full-campaign simulation
        run: bundle exec ruby test/gameplay_collision_test.rb

      - name: Upload unit coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-coverage
          path: coverage/unit.json
          if-no-files-found: error

  browser:
    name: Browser end-to-end
    runs-on: ${{ fromJSON(((github.event_name != 'workflow_dispatch' && vars.RAIBERT_CI_POOL == 'magneto') || (github.event_name == 'workflow_dispatch' && inputs.magneto && github.ref != 'refs/heads/main')) && '["self-hosted","Linux","X64","homelab-linux-x64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    env:
      BUNDLE_WITHOUT: desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install gems on the disposable runner
        if: runner.environment == 'self-hosted'
        run: |
          ruby -e 'abort "unexpected Ruby version" unless RUBY_VERSION == "4.0.7"'
          bundle config set --local path vendor/bundle
          bundle install

      - name: Set up Ruby
        if: runner.environment == 'github-hosted'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.7
          bundler-cache: true

      - name: Check image browser toolchain
        if: runner.environment == 'self-hosted'
        run: |
          test "$(node -v)" = v22.20.0
          echo 'PLAYWRIGHT_BROWSERS_PATH=/opt/playwright-browsers' >> "$GITHUB_ENV"

      - name: Set up Node.js
        if: runner.environment == 'github-hosted'
        uses: actions/setup-node@v6
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install browser test dependencies
        run: npm ci --prefix web

      - name: Install Chromium on hosted runner
        if: runner.environment == 'github-hosted'
        run: npx --prefix web playwright install --with-deps chromium

      - name: Rebuild Ruby WebAssembly application
        run: script/build_web

      - name: Run Web Audio unit tests
        run: |
          npm --prefix web test
          node test/analytics_test.mjs
          node test/telemetry_test.mjs

      - name: Run Chromium end-to-end tests
        run: npm --prefix web run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 14
