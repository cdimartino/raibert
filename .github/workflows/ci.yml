name: Magneto lifecycle acceptance
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Expected runner teardown path
        options: [failure, cancellation]
        required: true
permissions: {}
jobs:
  probe:
    name: Disposable guest teardown
    if: github.ref == 'refs/heads/ci/magneto-lifecycle-probe'
    runs-on: [self-hosted, Linux, X64, homelab-linux-x64]
    timeout-minutes: 10
    steps:
      - name: Assert clean guest and leave disposable marker
        run: |
          test ! -e /tmp/magneto-teardown-marker
          echo "$GITHUB_RUN_ID" > /tmp/magneto-teardown-marker
          uname -m
      - name: Deliberate nonzero test result
        if: inputs.mode == 'failure'
        run: exit 17
      - name: Wait for GitHub cancellation
        if: inputs.mode == 'cancellation'
        run: sleep 480
