<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07100d"><title>Rai*bert // ship it</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/web/app.css"></head>
<body><main id="game-surface"><canvas id="game" width="1000" height="760" tabindex="0" aria-label="Rai*bert. Use Q, E, A, and D on a keyboard, or swipe diagonally on a touch screen, to hop across changing gemstone and impossible stair boards."></canvas><p id="status" role="status" aria-live="polite">Loading Rai*bert…</p>
<section id="floating-controls" aria-label="Floating game controls" hidden><button class="grip" type="button" aria-label="Drag controls">⠿</button><button type="button" data-action="up_left" aria-label="Hop up-left">↖</button><button type="button" data-action="up_right" aria-label="Hop up-right">↗</button><button type="button" data-action="down_left" aria-label="Hop down-left">↙</button><button type="button" data-action="down_right" aria-label="Hop down-right">↘</button><button class="mini-menu" type="button" data-menu aria-label="Pause menu">Ⅱ</button></section></main>
<dialog id="menu-dialog" aria-labelledby="menu-title"><form method="dialog"><h2 id="menu-title">Rai*bert Menu</h2><button value="resume" data-menu-primary>Resume</button><button type="button" data-leaderboard>Worldwide Top 15</button><label><input id="floating-toggle" type="checkbox"> Floating controls</label><button type="button" data-mute>Mute / unmute</button><button type="button" data-reset>Reset defaults</button></form></dialog>
<dialog id="ending-dialog" aria-labelledby="ending-title"><div class="ending-card"><p class="ending-eyebrow">RUN COMPLETE</p><h2 id="ending-title"></h2><p id="ending-score"></p><p id="ending-bonuses"></p><p class="ending-next">Next: worldwide leaderboard</p><button type="button" data-view-scores>View leaderboard</button></div></dialog>
<dialog id="leaderboard-dialog" aria-labelledby="leaderboard-title">
  <div class="leaderboard-card">
    <header class="scoreboard-header">
      <div><p class="scoreboard-kicker">RAI*BERT <span aria-hidden="true">/</span> WORLDWIDE</p><h2 id="leaderboard-title">High scores<span class="board-badge">TOP 15</span></h2></div>
      <button type="button" data-close aria-label="Close leaderboard">×</button>
    </header>
    <section id="run-result" aria-live="polite" hidden>
      <div class="run-heading"><span class="run-dot" aria-hidden="true"></span><h3 id="run-outcome"></h3><span class="run-label">YOUR RUN</span></div>
      <p id="run-summary"></p>
    </section>
    <div class="table-wrap"><table><caption class="sr-only">Worldwide top fifteen scores, highest first</caption><thead><tr><th scope="col">Rank</th><th scope="col">Player</th><th scope="col">Score</th><th scope="col">Stage</th><th scope="col">Mode</th><th scope="col">Run</th></tr></thead><tbody id="leaderboard-rows"></tbody></table></div>
    <form id="initials-form" hidden>
      <label for="initials">You made the board — enter three initials</label>
      <div class="initials-entry"><input id="initials" name="initials" inputmode="text" autocomplete="off" maxlength="3" pattern="[A-Za-z]{3}" aria-describedby="initials-help"></div>
      <small id="initials-help">Letters A–Z only.</small>
    </form>
    <p id="leaderboard-status" role="status" aria-live="polite">Loading worldwide scores…</p>
    <footer><button type="button" data-retry aria-label="Refresh scoreboard"><span aria-hidden="true">↻</span> Refresh</button><div class="scoreboard-actions"><button type="submit" form="initials-form" data-submit-score hidden>Submit score</button><button type="button" data-skip hidden>Skip score</button><button type="button" data-play-again title="Start a new run" hidden>Retry game</button></div></footer>
  </div>
</dialog>
<script type="module" src="/web/app.js"></script></body></html>
