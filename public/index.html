<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07100d"><title>Rai*bert // ship it</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/web/app.css"></head>
<body><main id="game-surface"><canvas id="game" width="1000" height="760" tabindex="0" aria-label="Rai*bert. Use Q, E, A, and D on a keyboard, or diagonal swipes on a touch screen, to hop across the pyramid."></canvas><p id="status" role="status" aria-live="polite">Loading Rai*bert…</p>
<section id="floating-controls" aria-label="Floating game controls" hidden><button class="grip" type="button" aria-label="Drag controls">⠿</button><button type="button" data-action="up_left" aria-label="Hop up-left">↖</button><button type="button" data-action="up_right" aria-label="Hop up-right">↗</button><button type="button" data-action="down_left" aria-label="Hop down-left">↙</button><button type="button" data-action="down_right" aria-label="Hop down-right">↘</button><button class="mini-menu" type="button" data-menu aria-label="Pause menu">Ⅱ</button></section></main>
<dialog id="menu-dialog" aria-labelledby="menu-title"><form method="dialog"><h2 id="menu-title">Rai*bert Menu</h2><button value="resume">Resume</button><button type="button" data-leaderboard>Worldwide Top 15</button><label><input id="floating-toggle" type="checkbox"> Floating controls</label><button type="button" data-mute>Mute / unmute</button><button type="button" data-reset>Reset defaults</button></form></dialog>
<dialog id="leaderboard-dialog" aria-labelledby="leaderboard-title"><div class="leaderboard-card"><header><div><p>WORLDWIDE</p><h2 id="leaderboard-title">TOP 15</h2></div><button type="button" data-close aria-label="Close leaderboard">×</button></header><p id="leaderboard-status" role="status" aria-live="polite">Loading worldwide scores…</p><form id="initials-form" hidden><label for="initials">You made the board — enter three initials</label><input id="initials" name="initials" inputmode="text" autocomplete="off" maxlength="3" pattern="[A-Za-z]{3}" aria-describedby="initials-help"><small id="initials-help">Letters A–Z only.</small><div><button type="submit">Submit score</button><button type="button" data-skip>Skip</button></div></form><div class="table-wrap"><table><thead><tr><th>#</th><th>Player</th><th>Score</th><th>Stage</th><th>Mode</th><th>Run</th></tr></thead><tbody id="leaderboard-rows"></tbody></table></div><footer><button type="button" data-retry>Retry</button><button type="button" data-close>Close</button></footer></div></dialog>
<script type="module" src="/web/app.js"></script></body></html>
