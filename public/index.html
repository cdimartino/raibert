<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#07100d">
    <title>Rai*bert // ship it</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/web/app.css">
  </head>
  <body>
    <main>
      <div class="game-frame">
        <canvas id="game" width="1000" height="760" tabindex="0" aria-label="Rai*bert game"></canvas>
        <p id="status" role="status" aria-live="polite">Loading Rai*bert…</p>
      </div>

      <section class="controls" aria-label="Game controls">
        <div class="directions" aria-label="Movement and menu selection">
          <button type="button" data-key="q" aria-label="Move up-left or select up">↖<span>Up-left</span></button>
          <button type="button" data-key="e" aria-label="Move up-right or select right">↗<span>Up-right</span></button>
          <button type="button" data-key="a" aria-label="Move down-left or select left">↙<span>Down-left</span></button>
          <button type="button" data-key="d" aria-label="Move down-right or select down">↘<span>Down-right</span></button>
        </div>
        <div class="actions">
          <button type="button" data-key="return">Start / confirm</button>
          <button type="button" data-key="escape">Pause / back</button>
          <button type="button" data-key="o">Options</button>
          <button type="button" data-key="m">Mute</button>
        </div>
      </section>
      <p class="keyboard-help">Keyboard: Q, E, A, D to move · O for options · Enter to confirm · Esc to pause · M to mute</p>
    </main>
    <script type="module" src="/web/app.js"></script>
  </body>
</html>
