                  [
                    "RaiBert/Usage",
                    "GameStarts",
                    "Site",
                    "raibert.lol",
                    {}
                  ],
                  [
                    "RaiBert/Usage",
                    "GameOvers",
                    "Site",
                    "raibert.lol",
                    {}
                  ],
                  [
                    "RaiBert/Usage",
                    "Victories",
                    "Site",
                    "raibert.lol",
                    {}
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 18,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Active play minutes / 5 minutes",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Sum",
                "period": 300,
                "liveData": true,
                "metrics": [
                  [
                    "RaiBert/Usage",
                    "ActivePlaySeconds",
                    "Site",
                    "raibert.lol",
                    {
                      "id": "s",
                      "visible": false
                    }
                  ],
                  [
                    {
                      "expression": "s/60",
                      "label": "Active play minutes",
                      "id": "e1"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 18,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Runtime error reports / 5 minutes",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Sum",
                "period": 300,
                "liveData": true,
                "metrics": [
                  [
                    "RaiBert/Usage",
                    "RuntimeErrors",
                    "Site",
                    "raibert.lol",
                    {}
                  ]
                ]
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 24,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Referrers: visits, starts and active minutes",
                "region": "${AWS::Region}",
                "view": "table",
                "query": "SOURCE '/aws/lambda/${AnalyticsFunction}' | filter ispresent(event) | stats sum(PageViews) as pageViews, sum(Sessions) as tabSessions, sum(GameStarts) as gameStarts, sum(ActivePlaySeconds)/60 as activeMinutes by referrer | sort pageViews desc | limit 20"
              }
            },
            {
              "type": "log",
              "x": 12,
              "y": 24,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Input device: visits and gameplay",
                "region": "${AWS::Region}",
                "view": "table",
                "query": "SOURCE '/aws/lambda/${AnalyticsFunction}' | filter ispresent(event) | stats sum(PageViews) as pageViews, sum(GameStarts) as gameStarts, sum(GameOvers) as gameOvers, sum(Victories) as victories, sum(ActivePlaySeconds)/60 as activeMinutes by device | sort pageViews desc"
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 30,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Daily activity (UTC days; partial boundary days)",
                "region": "${AWS::Region}",
                "view": "table",
                "query": "SOURCE '/aws/lambda/${AnalyticsFunction}' | filter ispresent(event) | stats sum(PageViews) as pageViews, sum(Sessions) as tabSessions, sum(GameStarts) as gameStarts, sum(GameOvers) as gameOvers, sum(Victories) as victories, sum(ActivePlaySeconds)/60 as activeMinutes by bin(1d) as day | sort day desc"
              }
            },
            {
              "type": "log",
              "x": 12,
              "y": 30,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Freshness: most recent report of each event",
                "region": "${AWS::Region}",
                "view": "table",
                "query": "SOURCE '/aws/lambda/${AnalyticsFunction}' | filter ispresent(event) | stats count(*) as reports, max(@timestamp) as lastEvent by event | sort lastEvent desc"
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 36,
              "width": 24,
              "height": 6,
              "properties": {
                "title": "Recent anonymous events (UTC timestamps)",
                "region": "${AWS::Region}",
                "view": "table",
                "query": "SOURCE '/aws/lambda/${AnalyticsFunction}' | filter ispresent(event) | fields @timestamp, event, device, referrer, seconds | sort @timestamp desc | limit 25"
              }
            },
            {
              "type": "text",
              "x": 0,
              "y": 48,
              "width": 24,
              "height": 4,
              "properties": {
                "markdown": "### How to read this\nActive time excludes paused/hidden gameplay. Starts per session and minutes per start are aggregate ratios, not conversion or average completed-session duration. Runs may cross the selected time boundary. Referrer is the referring hostname; `direct` also includes unavailable referrers. Device reflects coarse-pointer input, not a verified device model.\n\nTracking respects privacy settings and can be blocked, lost, or spoofed. No person IDs, IPs, countries, scores, character or difficulty are collected by this analytics pipeline. No cohort retention or unique-player estimates are inferred. Log tables retain up to 30 days and incur query charges on refresh; avoid rapid auto-refresh. Metrics have longer retention."
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 42,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "CDN requests / 5 minutes (assets and bots included)",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Sum",
                "period": 300,
                "liveData": true,
                "metrics": [
                  [
                    "AWS/CloudFront",
                    "Requests",
                    "DistributionId",
                    "${SiteDistribution}",
                    "Region",
                    "Global"
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 42,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "CDN bytes downloaded / 5 minutes",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Sum",
                "period": 300,
                "liveData": true,
                "metrics": [
                  [
                    "AWS/CloudFront",
                    "BytesDownloaded",
                    "DistributionId",
                    "${SiteDistribution}",
                    "Region",
                    "Global"
                  ]
                ]
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 52,
              "width": 24,
              "height": 8,
              "properties": {
                "title": "Runtime failures by version, browser and safe error location (legacy reports have no details)",
                "region": "${AWS::Region}",
                "view": "table",
                "query": "SOURCE '/aws/lambda/${AnalyticsFunction}' | filter event = 'runtime_error' | fields coalesce(diagnostics.release, 'legacy') as release, coalesce(diagnostics.browser, 'unknown') as browser, coalesce(diagnostics.phase, 'unknown') as phase, coalesce(diagnostics.errorType, 'unknown') as errorType, coalesce(diagnostics.source, 'unknown') as source, coalesce(diagnostics.line, 0) as line | stats count(*) as reports, max(@timestamp) as lastSeen by release, browser, phase, errorType, source, line | sort lastSeen desc | limit 50"
              }
            }
          ]
        }

  LeaderboardTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  LeaderboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../leaderboard/
      Handler: handler.handler
      Runtime: ruby4.0
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 5
      ReservedConcurrentExecutions: !If
        - ReserveLeaderboardConcurrency
        - !Ref LeaderboardReservedConcurrency
        - !Ref AWS::NoValue
      Environment:
        Variables:
          LEADERBOARD_TABLE: !Ref LeaderboardTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LeaderboardTable

  LeaderboardFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${LeaderboardFunction}
      RetentionInDays: 30

  LeaderboardErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Leaderboard Lambda errors require investigation
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref LeaderboardFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  LeaderboardThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Leaderboard Lambda throttling requires investigation
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref LeaderboardFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  LeaderboardFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: AWS_IAM
      InvokeMode: BUFFERED
      TargetFunctionArn: !GetAtt LeaderboardFunction.Arn

  LeaderboardFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref LeaderboardFunction
      FunctionUrlAuthType: AWS_IAM
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

  LeaderboardFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LeaderboardFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

  LeaderboardWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      DefaultAction:
        Allow: {}
      Scope: CLOUDFRONT
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: raibert-leaderboard
        SampledRequestsEnabled: true
      Rules:
      - Name: ApiRateLimit
        Priority: 0
        Action:
          Block: {}
        Statement:
          RateBasedStatement:
            AggregateKeyType: IP
            Limit: 100
            EvaluationWindowSec: 300
            ScopeDownStatement:
              ByteMatchStatement:
                FieldToMatch:
                  UriPath: {}
                PositionalConstraint: STARTS_WITH
                SearchString: "/api/"
                TextTransformations:
                - Priority: 0
                  Type: NONE
        VisibilityConfig:
          CloudWatchMetricsEnabled: true
          MetricName: raibert-api-rate-limit
          SampledRequestsEnabled: true
      - Name: AmazonIpReputation
        Priority: 1
        OverrideAction:
          Count: {}
        Statement:
          ManagedRuleGroupStatement:
            VendorName: AWS
            Name: AWSManagedRulesAmazonIpReputationList
            RuleActionOverrides:
            - Name: AWSManagedIPReputationList
              ActionToUse:
                Count: {}
            - Name: AWSManagedReconnaissanceList
              ActionToUse:
                Count: {}
            - Name: AWSManagedIPDDoSList
              ActionToUse:
                Count: {}
        VisibilityConfig:
          CloudWatchMetricsEnabled: true
          MetricName: raibert-ip-reputation
          SampledRequestsEnabled: false
      - Name: ScoreSubmissionRateLimit
        Priority: 2
        Action:
          Count: {}
        Statement:
          RateBasedStatement:
            AggregateKeyType: IP
            Limit: 10
            EvaluationWindowSec: 300
            ScopeDownStatement:
              AndStatement:
                Statements:
                - ByteMatchStatement:
                    FieldToMatch:
                      UriPath: {}
                    PositionalConstraint: EXACTLY
                    SearchString: "/api/leaderboard"
                    TextTransformations:
                    - Priority: 0
                      Type: NONE
                - ByteMatchStatement:
                    FieldToMatch:
                      Method: {}
                    PositionalConstraint: EXACTLY
                    SearchString: POST
                    TextTransformations:
                    - Priority: 0
                      Type: NONE
        VisibilityConfig:
          CloudWatchMetricsEnabled: true
          MetricName: raibert-score-rate-limit
          SampledRequestsEnabled: false
      - Name: InvalidApiRequest
        Priority: 3
        Action:
          Count: {}
        Statement:
          AndStatement:
            Statements:
            - ByteMatchStatement:
                FieldToMatch:
                  UriPath: {}
                PositionalConstraint: STARTS_WITH
                SearchString: "/api/"
                TextTransformations:
                - Priority: 0
                  Type: NONE
            - NotStatement:
                Statement:
                  OrStatement:
                    Statements:
                    - AndStatement:
                        Statements:
                        - ByteMatchStatement:
                            FieldToMatch:
                              UriPath: {}
                            PositionalConstraint: EXACTLY
                            SearchString: "/api/leaderboard"
                            TextTransformations:
                            - Priority: 0
                              Type: NONE
                        - ByteMatchStatement:
                            FieldToMatch:
                              Method: {}
                            PositionalConstraint: EXACTLY
                            SearchString: GET
                            TextTransformations:
                            - Priority: 0
                              Type: NONE
                        - SizeConstraintStatement:
                            FieldToMatch:
                              Body:
                                OversizeHandling: NO_MATCH
                            ComparisonOperator: LE
                            Size: 0
                            TextTransformations:
                            - Priority: 0
                              Type: NONE
                    - AndStatement:
                        Statements:
                        - ByteMatchStatement:
                            FieldToMatch:
                              UriPath: {}
                            PositionalConstraint: EXACTLY
                            SearchString: "/api/leaderboard"
                            TextTransformations:
                            - Priority: 0
                              Type: NONE
                        - ByteMatchStatement:
                            FieldToMatch:
                              Method: {}
                            PositionalConstraint: EXACTLY
                            SearchString: POST
                            TextTransformations:
                            - Priority: 0
                              Type: NONE
                        - SizeConstraintStatement:
                            FieldToMatch:
                              Body:
                                OversizeHandling: NO_MATCH
                            ComparisonOperator: LE
                            Size: 1024
                            TextTransformations:
                            - Priority: 0
                              Type: NONE
                    - AndStatement:
                        Statements:
                        - ByteMatchStatement:
                            FieldToMatch:
                              UriPath: {}
                            PositionalConstraint: EXACTLY
                            SearchString: "/api/analytics"
                            TextTransformations:
                            - Priority: 0
                              Type: NONE
                        - ByteMatchStatement:
                            FieldToMatch:
                              Method: {}
                            PositionalConstraint: EXACTLY
                            SearchString: POST
                            TextTransformations:
                            - Priority: 0
                              Type: NONE
                        - SizeConstraintStatement:
                            FieldToMatch:
