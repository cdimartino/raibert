                            - Priority: 0
                              Type: NONE
        VisibilityConfig:
          CloudWatchMetricsEnabled: true
          MetricName: raibert-invalid-api
          SampledRequestsEnabled: false
  OperationsAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName:
        Fn::Sub: "${AWS::StackName}-operations-alerts"
  OperationsAlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn:
        Ref: OperationsAlertTopic
      Protocol: email
      Endpoint:
        Ref: AlertEmail
  OperationsAlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
      - Ref: OperationsAlertTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: cloudwatch.amazonaws.com
          Action: sns:Publish
          Resource:
            Ref: OperationsAlertTopic
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnLike:
              aws:SourceArn:
                Fn::Sub: arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-*
  TrafficSpikeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: "${AWS::StackName}-traffic-spike"
      AlarmDescription: CDN traffic above 1000 requests per 5 minutes; includes assets
        and bots. Investigate before changing limits.
      Namespace: AWS/CloudFront
      MetricName: Requests
      Dimensions:
      - Name: DistributionId
        Value:
          Ref: SiteDistribution
      - Name: Region
        Value: Global
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: OperationsAlertTopic
  MonthlySpendAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: "${AWS::StackName}-account-monthly-spend"
      AlarmDescription: Account-wide estimated month-to-date AWS charges reached USD
        15; delayed billing data, not a hard cap.
      Namespace: AWS/Billing
      MetricName: EstimatedCharges
      Dimensions:
      - Name: Currency
        Value: USD
      Statistic: Maximum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: 15
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions:
      - Ref: OperationsAlertTopic

  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: raibert.lol
      SubjectAlternativeNames:
        - www.raibert.lol
      DomainValidationOptions:
        - DomainName: raibert.lol
          HostedZoneId: !Ref HostedZoneId
        - DomainName: www.raibert.lol
          HostedZoneId: !Ref HostedZoneId
      ValidationMethod: DNS
      Tags:
        - Key: Application
          Value: raibert
        - Key: Environment
          Value: production

  CanonicalRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect www.raibert.lol to the canonical apex hostname
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function queryString(query) {
          var values = [];
          for (var name in query) {
            var item = query[name];
            var entries = item.multiValue || [item];
            for (var i = 0; i < entries.length; i++) {
              var pair = encodeURIComponent(name);
              if (entries[i].value !== '') {
                pair += '=' + encodeURIComponent(entries[i].value);
              }
              values.push(pair);
            }
          }
          return values.length ? '?' + values.join('&') : '';
        }

        function handler(event) {
          var request = event.request;
          if (request.headers.host.value.toLowerCase() === 'www.raibert.lol') {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: {
                location: { value: 'https://raibert.lol' + request.uri + queryString(request.querystring) },
                'cache-control': { value: 'public, max-age=3600' }
              }
            };
          }
          return request;
        }
      Name: !Sub ${AWS::StackName}-canonical-host

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Comment: Security headers for the Rai*bert browser application
        Name: !Sub ${AWS::StackName}-security-headers
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: same-origin
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
            Preload: false

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        WebACLId: !GetAtt LeaderboardWebAcl.Arn
        Aliases:
          - raibert.lol
          - www.raibert.lol
        Comment: Rai*bert production site
        CustomErrorResponses:
          - ErrorCachingMinTTL: 60
            ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCachingMinTTL: 60
            ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt CanonicalRedirectFunction.FunctionARN
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        CacheBehaviors:
          - PathPattern: /api/analytics
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            TargetOriginId: analytics-function
            ViewerProtocolPolicy: https-only
          - PathPattern: /api/*
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            TargetOriginId: leaderboard-function
            ViewerProtocolPolicy: https-only
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt SiteBucket.RegionalDomainName
            Id: site-bucket
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
          - CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            DomainName: !Select [2, !Split ["/", !GetAtt LeaderboardFunctionUrl.FunctionUrl]]
            Id: leaderboard-function
            OriginAccessControlId: !Ref LeaderboardOriginAccessControl
          - CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            DomainName: !Select [2, !Split ["/", !GetAtt AnalyticsFunctionUrl.FunctionUrl]]
            Id: analytics-function
            OriginAccessControlId: !Ref LeaderboardOriginAccessControl
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref SiteCertificate
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
      Tags:
        - Key: Application
          Value: raibert
        - Key: Environment
          Value: production

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

  ApexAliasA:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2
      HostedZoneId: !Ref HostedZoneId
      Name: raibert.lol
      Type: A

  ApexAliasAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2
      HostedZoneId: !Ref HostedZoneId
      Name: raibert.lol
      Type: AAAA

  WwwAliasA:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2
      HostedZoneId: !Ref HostedZoneId
      Name: www.raibert.lol
      Type: A

  WwwAliasAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2
      HostedZoneId: !Ref HostedZoneId
      Name: www.raibert.lol
      Type: AAAA

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Application
          Value: raibert
      Url: https://token.actions.githubusercontent.com

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:ref:refs/heads/main
      Policies:
        - PolicyName: DeploySiteContent
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListSiteBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Sid: ManageSiteObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${SiteBucket.Arn}/*
              - Sid: InvalidateSiteDistribution
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}
              - Sid: ReadDeploymentOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
      RoleName: raibert-lol-github-deploy
      Tags:
        - Key: Application
          Value: raibert
        - Key: Environment
          Value: production

Outputs:
  UsageDashboardUrl:
    Description: Private visitor and gameplay analytics (AWS sign-in required)
    Value: !Sub https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}-usage
  SiteUrl:
    Description: Canonical production URL
    Value: https://raibert.lol
  SiteBucketName:
    Description: Private S3 origin bucket
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution ID
    Value: !Ref SiteDistribution
  DistributionDomainName:
    Description: CloudFront distribution hostname
    Value: !GetAtt SiteDistribution.DomainName
  LeaderboardTableName:
    Description: Retained DynamoDB leaderboard table
    Value: !Ref LeaderboardTable
  DeployRoleArn:
    Description: Set this as the GitHub repository variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
