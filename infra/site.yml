AWSTemplateFormatVersion: "2010-09-09"
Description: Static hosting for Rai*bert at raibert.lol

Parameters:
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Existing public Route 53 hosted zone for raibert.lol
  GitHubRepository:
    Type: String
    Default: cdimartino/raibert
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: Existing token.actions.githubusercontent.com IAM OIDC provider ARN, if present

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, ""]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub raibert-lol-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Application
          Value: raibert
        - Key: Environment
          Value: production
      VersioningConfiguration:
        Status: Enabled

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Signed access to the private Rai*bert site bucket
        Name: !Sub ${AWS::StackName}-s3
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: raibert.lol
      SubjectAlternativeNames:
        - www.raibert.lol
      DomainValidationOptions:
        - DomainName: raibert.lol
          HostedZoneId: !Ref HostedZoneId
        - DomainName: www.raibert.lol
          HostedZoneId: !Ref HostedZoneId
      ValidationMethod: DNS
      Tags:
        - Key: Application
          Value: raibert
        - Key: Environment
          Value: production

  CanonicalRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect www.raibert.lol to the canonical apex hostname
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function queryString(query) {
          var values = [];
          for (var name in query) {
            var item = query[name];
            var entries = item.multiValue || [item];
            for (var i = 0; i < entries.length; i++) {
              var pair = encodeURIComponent(name);
              if (entries[i].value !== '') {
                pair += '=' + encodeURIComponent(entries[i].value);
              }
              values.push(pair);
            }
          }
          return values.length ? '?' + values.join('&') : '';
        }

        function handler(event) {
          var request = event.request;
          if (request.headers.host.value.toLowerCase() === 'www.raibert.lol') {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: {
                location: { value: 'https://raibert.lol' + request.uri + queryString(request.querystring) },
                'cache-control': { value: 'public, max-age=3600' }
              }
            };
          }
          return request;
        }
      Name: !Sub ${AWS::StackName}-canonical-host

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Comment: Security headers for the Rai*bert browser application
        Name: !Sub ${AWS::StackName}-security-headers
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: same-origin
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
            Preload: false

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - raibert.lol
          - www.raibert.lol
        Comment: Rai*bert production site
        CustomErrorResponses:
          - ErrorCachingMinTTL: 60
            ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCachingMinTTL: 60
            ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt CanonicalRedirectFunction.FunctionARN
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt SiteBucket.RegionalDomainName
            Id: site-bucket
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref SiteCertificate
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
      Tags:
        - Key: Application
          Value: raibert
        - Key: Environment
          Value: production

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

  ApexAliasA:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2
      HostedZoneId: !Ref HostedZoneId
      Name: raibert.lol
      Type: A

  ApexAliasAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2
      HostedZoneId: !Ref HostedZoneId
      Name: raibert.lol
      Type: AAAA

  WwwAliasA:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2
      HostedZoneId: !Ref HostedZoneId
      Name: www.raibert.lol
      Type: A

  WwwAliasAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2
      HostedZoneId: !Ref HostedZoneId
      Name: www.raibert.lol
      Type: AAAA

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Application
          Value: raibert
      Url: https://token.actions.githubusercontent.com

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:ref:refs/heads/main
      Policies:
        - PolicyName: DeploySiteContent
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListSiteBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Sid: ManageSiteObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${SiteBucket.Arn}/*
              - Sid: InvalidateSiteDistribution
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}
              - Sid: ReadDeploymentOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
      RoleName: raibert-lol-github-deploy
      Tags:
        - Key: Application
          Value: raibert
        - Key: Environment
          Value: production

Outputs:
  SiteUrl:
    Description: Canonical production URL
    Value: https://raibert.lol
  SiteBucketName:
    Description: Private S3 origin bucket
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution ID
    Value: !Ref SiteDistribution
  DistributionDomainName:
    Description: CloudFront distribution hostname
    Value: !GetAtt SiteDistribution.DomainName
  DeployRoleArn:
    Description: Set this as the GitHub repository variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
