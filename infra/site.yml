              "properties": {
                "title": "Game starts per tab session",
                "region": "${AWS::Region}",
                "view": "singleValue",
                "stat": "Sum",
                "period": 300,
                "liveData": true,
                "metrics": [
                  [
                    "RaiBert/Usage",
