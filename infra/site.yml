AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Rai*bert static game and persistent worldwide leaderboard

Parameters:
  AlertEmail:
    Type: String
    Description: Email recipient for operations and account spending alerts; confirm
      the SNS subscription email
    AllowedPattern: '[^ @]+@[^ @]+\.[^ @]+'
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Existing public Route 53 hosted zone for raibert.lol
  GitHubRepository:
    Type: String
    Default: cdimartino@191587/raibert@1373118135
    Description: GitHub OIDC repository identity in owner@owner-id/repository@repository-id form
    AllowedPattern: "^[A-Za-z0-9_.-]+@[0-9]+/[A-Za-z0-9_.-]+@[0-9]+$"
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: Existing token.actions.githubusercontent.com IAM OIDC provider ARN, if present
  LeaderboardReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: Reserved Lambda concurrency; leave at zero in accounts with the initial 10-execution quota

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, ""]
  ReserveLeaderboardConcurrency: !Not [!Equals [!Ref LeaderboardReservedConcurrency, 0]]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub raibert-lol-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Application
          Value: raibert
        - Key: Environment
          Value: production
      VersioningConfiguration:
        Status: Enabled

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Signed access to the private Rai*bert site bucket
        Name: !Sub ${AWS::StackName}-s3
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  LeaderboardOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Signed access to the private leaderboard function URL
        Name: !Sub ${AWS::StackName}-leaderboard
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  AnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../analytics/
      Handler: handler.handler
      Runtime: ruby4.0
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 3
      LoggingConfig:
        LogFormat: Text

  AnalyticsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AnalyticsFunction}
      RetentionInDays: 30

  AnalyticsFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: AWS_IAM
      InvokeMode: BUFFERED
      TargetFunctionArn: !GetAtt AnalyticsFunction.Arn

  AnalyticsFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref AnalyticsFunction
      FunctionUrlAuthType: AWS_IAM
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

  AnalyticsFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AnalyticsFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

  UsageDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-usage
      DashboardBody: !Sub |
        {
          "start": "-P1D",
          "periodOverride": "inherit",
          "widgets": [
            {
              "type": "text",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 4,
              "properties": {
                "markdown": "# RaiBert analytics\n[Operations](https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}-operations) \u00b7 [Cost](https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}-cost)\n\nTotals follow the selected time range. Charts use 5-minute buckets, including partial live data; recent values can change. Refresh to fetch newer data. Sessions are browser-tab sessions, not unique people. Blank means no reported samples, not confirmed zero."
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 4,
              "width": 4,
              "height": 4,
              "properties": {
                "title": "Page views",
                "region": "${AWS::Region}",
                "view": "singleValue",
                "stat": "Sum",
                "period": 300,
                "liveData": true,
                "metrics": [
                  [
                    "RaiBert/Usage",
                    "PageViews",
                    "Site",
                    "raibert.lol",
                    {}
                  ]
                ],
                "setPeriodToTimeRange": true
              }
            },
            {
              "type": "metric",
              "x": 4,
              "y": 4,
              "width": 4,
              "height": 4,
              "properties": {
                "title": "Tab sessions",
                "region": "${AWS::Region}",
                "view": "singleValue",
                "stat": "Sum",
                "period": 300,
                "liveData": true,
                "metrics": [
                  [
                    "RaiBert/Usage",
                    "Sessions",
                    "Site",
                    "raibert.lol",
                    {}
                  ]
                ],
                "setPeriodToTimeRange": true
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 4,
              "width": 4,
              "height": 4,
              "properties": {
                "title": "Game starts",
                "region": "${AWS::Region}",
                "view": "singleValue",
                "stat": "Sum",
                "period": 300,
                "liveData": true,
